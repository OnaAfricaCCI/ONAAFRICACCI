# Supabase project configuration.
#
# The reason this file exists: Edge Functions are deployed with Supabase's own
# JWT check switched ON unless told otherwise, and that setting is reapplied on
# every deploy. The two scheduled functions are called by pg_cron from inside
# the database, which sends no JWT — it authenticates with the x-digest-secret
# header that each function checks for itself. Without this file, the next
# `functions deploy` silently puts the JWT wall back up and both scheduled jobs
# start failing with 401, with nothing on the site to show it.
#
# receive-apify-data is deliberately left at the default: Apify's webhook does
# send an authorization header, so its JWT check stays on — belt as well as
# braces, since it also checks the digest secret.

project_id = "fperytyukppkkjjfkwgl"

# ---------------------------------------------------------------------------
# LOCAL DEVELOPMENT ONLY (the `supabase start` stack on your machine).
#
# These sections configure the LOCAL Supabase containers so the grant-seeker
# accounts feature can be verified end to end: email magic-link auth with a
# local mail sink (Inbucket), and the callback redirect allow-list.
#
# They do NOT affect the hosted project unless someone runs `supabase config
# push` — DO NOT run that with these localhost values. Production Auth is
# configured in the Supabase dashboard (Authentication → URL configuration),
# not here. See docs/local-verification-runbook.md.
# ---------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://localhost:3000"
# Allow the magic-link callback (with its ?next=…&save=… query) on both hosts.
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
# Magic link / OTP sign-in. No separate signup confirmation step locally; the
# link itself proves email ownership. Locally, auth emails go to Inbucket.
enable_confirmations = false

[inbucket]
# Local mail sink for auth emails. Web UI at http://localhost:54324.
enabled = true
port = 54324

[functions.check-links]
verify_jwt = false

[functions.weekly-digest]
verify_jwt = false
